name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
        dependencies: [latest]
        include:
          - php: '8.4'
            dependencies: lowest
    name: PHP ${{ matrix.php }} / Laravel 13 / ${{ matrix.dependencies || 'latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, curl, zip, sqlite3
          coverage: none
          tools: composer:v2
      - name: Authenticate Nova
        env:
          NOVA_USERNAME: ${{ secrets.NOVA_USERNAME }}
          NOVA_LICENSE_KEY: ${{ secrets.NOVA_LICENSE_KEY }}
        run: |
          if [ -z "$NOVA_USERNAME" ] || [ -z "$NOVA_LICENSE_KEY" ]; then
            echo 'Set the NOVA_USERNAME and NOVA_LICENSE_KEY repository secrets to install Laravel Nova.'
            exit 1
          fi
          composer config --global http-basic.nova.laravel.com "$NOVA_USERNAME" "$NOVA_LICENSE_KEY"
      - name: Install dependencies
        env:
          DEPENDENCIES: ${{ matrix.dependencies }}
          # Nova's OpenSpout dependency does not yet allow PHP 8.6.
          COMPOSER_IGNORE_PLATFORM_REQ: ${{ matrix.php == '8.6' && 'php+' || '' }}
        run: |
          if [ "$DEPENDENCIES" = 'lowest' ]; then
            composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction
          else
            composer update --prefer-dist --no-interaction
          fi
      - run: composer test
      - run: composer analyse
      - run: composer format:test
      - run: composer audit

  assets:
    name: Frontend assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: git diff --exit-code -- dist
      - run: npm audit
